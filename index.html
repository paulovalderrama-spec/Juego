<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cars - ¡Toca la pantalla!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a90d0;
      overflow: hidden;
      touch-action: none;
      font-family: 'Arial Rounded MT Bold', 'Arial Black', Arial, sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100dvh; }
    #prompt {
      position: fixed;
      bottom: 36px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 900;
      text-shadow: 0 3px 10px rgba(0,0,0,0.6), 0 0 20px rgba(255,200,0,0.5);
      pointer-events: none;
      letter-spacing: 0.05em;
      animation: bounce 1.4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.04); }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="prompt">¡Toca la pantalla! 🏎️</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const prompt = document.getElementById('prompt');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Audio ─────────────────────────────────────────────────────────────────────
const AC = window.AudioContext || window.webkitAudioContext;
let ac;
function playCheer(charIdx) {
  try {
    if (!ac) ac = new AC();
    // Short happy chord
    const notes = [[523,0],[659,0.08],[784,0.16],[1047,0.24]];
    notes.forEach(([f, t]) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.frequency.value = f;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ac.currentTime + t);
      gain.gain.linearRampToValueAtTime(0.18, ac.currentTime + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.35);
      osc.start(ac.currentTime + t);
      osc.stop(ac.currentTime + t + 0.4);
    });
  } catch(e) {}
}

// ── Characters ────────────────────────────────────────────────────────────────
const CHARS = [
  { name: 'Rayo McQueen', phrases: ['¡Ka-Chow! ⚡', '¡Soy el número 1! 🏆', '¡Velocidad! 🔥'], draw: drawMcQueen,  color: '#CC0000', glow: '#FF6600' },
  { name: 'Mater',        phrases: ['¡Tú eres mi mejor amigo! 💛', '¡Bueno eso estuvo!', '¡Yeehaw! 🤠'],         draw: drawMater,    color: '#8B5E1A', glow: '#D4A017' },
  { name: 'Sally',        phrases: ['¡Qué emocionante! 💙', '¡Fantástico! ✨', '¡Bravo! 💙'],                    draw: drawSally,    color: '#1E90FF', glow: '#87CEEB' },
  { name: 'Doc Hudson',   phrases: ['¡Bien hecho, campeón! ⭐', '¡Excelente! 🏅', '¡Así se hace! 🎖️'],         draw: drawDoc,      color: '#0D47A1', glow: '#42A5F5' },
  { name: 'Ramone',       phrases: ['¡Eso es arte, ese! 💜', '¡Ay, caramba! 🎨', '¡Pintón! 💜'],                draw: drawRamone,   color: '#7B1FA2', glow: '#CE93D8' },
  { name: 'Chick Hicks',  phrases: ['¡Woohoo! 💚', '¡Genial! 🎉', '¡Sí, sí, sí! 🟢'],                         draw: drawChick,    color: '#1B5E20', glow: '#66BB6A' },
];
let charIdx = 0;

// ── Car drawing helpers ────────────────────────────────────────────────────────
function wheel(ctx, x, y, r, hubColor) {
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle='#1a1a1a'; ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,r*0.55,0,Math.PI*2);
  ctx.fillStyle='#999'; ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,r*0.3,0,Math.PI*2);
  ctx.fillStyle=hubColor||'#ccc'; ctx.fill();
}

function eye(ctx, x, y, rx, ry, irisColor, squint) {
  ctx.save();
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(x,y,rx*0.56,ry*0.56,0,0,Math.PI*2);
  ctx.fillStyle=irisColor||'#3399ff'; ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,rx*0.28,0,Math.PI*2);
  ctx.fillStyle='#111'; ctx.fill();
  if(squint){
    ctx.beginPath(); ctx.ellipse(x,y-ry*0.3,rx,ry*0.55,0,Math.PI,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fill();
  }
  ctx.restore();
}

function drawMcQueen(ctx, cx, cy, sc, t) {
  ctx.save(); ctx.translate(cx, cy + Math.sin(t*0.006)*5*sc); ctx.scale(sc,sc);
  // shadow
  ctx.beginPath(); ctx.ellipse(0,40,60,9,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fill();
  // spoiler
  ctx.beginPath(); ctx.moveTo(52,-18); ctx.lineTo(62,-32); ctx.lineTo(62,-18);
  ctx.fillStyle='#AA0000'; ctx.fill();
  // body
  ctx.beginPath();
  ctx.moveTo(-62,18); ctx.bezierCurveTo(-65,-2,-48,-12,-22,-22);
  ctx.lineTo(18,-30); ctx.bezierCurveTo(38,-30,52,-16,58,-2);
  ctx.lineTo(62,18); ctx.closePath();
  ctx.fillStyle='#DD1111'; ctx.fill();
  ctx.strokeStyle='#990000'; ctx.lineWidth=2; ctx.stroke();
  // highlight
  ctx.beginPath(); ctx.moveTo(-55,0); ctx.bezierCurveTo(-30,-20,20,-28,52,-8);
  ctx.strokeStyle='rgba(255,120,120,0.5)'; ctx.lineWidth=4; ctx.stroke();
  // windshield
  ctx.beginPath();
  ctx.moveTo(-2,-29); ctx.lineTo(34,-29); ctx.lineTo(44,-10); ctx.lineTo(-2,-10);
  ctx.closePath(); ctx.fillStyle='rgba(120,200,255,0.85)'; ctx.fill();
  ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.stroke();
  // eyes
  eye(ctx, 8,-20, 10,8,'#4488FF',true);
  eye(ctx,26,-20, 10,8,'#4488FF',true);
  // lightning bolt
  ctx.beginPath();
  ctx.moveTo(-38,-4); ctx.lineTo(-26,-18); ctx.lineTo(-20,-9);
  ctx.lineTo(-10,-22); ctx.lineTo(-14,-9); ctx.lineTo(-4,-9);
  ctx.lineTo(-20,8); ctx.lineTo(-24,-2); ctx.closePath();
  ctx.fillStyle='#FFD700'; ctx.fill(); ctx.strokeStyle='#FF8C00'; ctx.lineWidth=1; ctx.stroke();
  // #95
  ctx.fillStyle='#fff'; ctx.font='bold 13px Arial'; ctx.textAlign='center';
  ctx.fillText('95',-46,10);
  // grille
  ctx.beginPath(); ctx.moveTo(-62,2); ctx.lineTo(-62,14); ctx.lineTo(-50,14); ctx.lineTo(-50,2);
  ctx.fillStyle='#888'; ctx.fill(); ctx.strokeStyle='#555'; ctx.lineWidth=1; ctx.stroke();
  wheel(ctx,-40,30,16,'#CC0000'); wheel(ctx,38,30,16,'#CC0000');
  ctx.restore();
}

function drawMater(ctx, cx, cy, sc, t) {
  ctx.save(); ctx.translate(cx, cy + Math.sin(t*0.006+1)*5*sc); ctx.scale(sc,sc);
  ctx.beginPath(); ctx.ellipse(0,45,62,9,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fill();
  // tow hook arm
  ctx.beginPath(); ctx.moveTo(55,0); ctx.lineTo(70,-20); ctx.lineTo(72,-10);
  ctx.strokeStyle='#666'; ctx.lineWidth=5; ctx.stroke();
  // body (boxy truck)
  ctx.beginPath(); ctx.roundRect(-60,-10,120,38,6);
  ctx.fillStyle='#8B5A1A'; ctx.fill(); ctx.strokeStyle='#5a3a0a'; ctx.lineWidth=2; ctx.stroke();
  // cab
  ctx.beginPath(); ctx.roundRect(-55,-35,70,28,8);
  ctx.fillStyle='#9B6A2A'; ctx.fill(); ctx.strokeStyle='#5a3a0a'; ctx.lineWidth=2; ctx.stroke();
  // rust patches
  ctx.fillStyle='rgba(160,80,0,0.4)';
  ctx.beginPath(); ctx.ellipse(-30,5,12,6,0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(20,15,9,5,-0.2,0,Math.PI*2); ctx.fill();
  // windshield
  ctx.beginPath(); ctx.roundRect(-48,-32,58,20,5);
  ctx.fillStyle='rgba(120,200,255,0.8)'; ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.stroke();
  // eyes
  eye(ctx,-22,-24,10,8,'#55AA55',false);
  eye(ctx,8,-24,10,8,'#55AA55',false);
  // buck teeth
  ctx.fillStyle='#fffde0';
  ctx.beginPath(); ctx.roundRect(-14,-6,10,14,2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-1,-6,10,14,2); ctx.fill();
  ctx.strokeStyle='#ccc'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-4,-6); ctx.lineTo(-4,8); ctx.stroke();
  // dents
  ctx.strokeStyle='rgba(80,40,0,0.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(35,10,8,0.5,2.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(-38,8,6,0.5,2.5); ctx.stroke();
  wheel(ctx,-38,38,17,'#8B5A1A'); wheel(ctx,38,38,17,'#8B5A1A');
  ctx.restore();
}

function drawSally(ctx, cx, cy, sc, t) {
  ctx.save(); ctx.translate(cx, cy + Math.sin(t*0.006+2)*5*sc); ctx.scale(sc,sc);
  ctx.beginPath(); ctx.ellipse(0,38,58,8,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fill();
  // body - sleek Porsche shape
  ctx.beginPath();
  ctx.moveTo(-60,15); ctx.bezierCurveTo(-62,-5,-40,-18,-10,-24);
  ctx.lineTo(20,-26); ctx.bezierCurveTo(42,-26,56,-12,60,-2);
  ctx.lineTo(60,15); ctx.closePath();
  ctx.fillStyle='#29B6F6'; ctx.fill(); ctx.strokeStyle='#0277BD'; ctx.lineWidth=2; ctx.stroke();
  // highlight
  ctx.beginPath(); ctx.moveTo(-48,-2); ctx.bezierCurveTo(-20,-20,10,-24,50,-10);
  ctx.strokeStyle='rgba(180,240,255,0.6)'; ctx.lineWidth=4; ctx.stroke();
  // windshield
  ctx.beginPath();
  ctx.moveTo(-8,-23); ctx.lineTo(26,-25); ctx.lineTo(40,-10); ctx.lineTo(-8,-10);
  ctx.closePath(); ctx.fillStyle='rgba(135,220,255,0.8)'; ctx.fill();
  ctx.strokeStyle='#0277BD'; ctx.lineWidth=1.5; ctx.stroke();
  // eyes with lashes
  eye(ctx,6,-18,10,8,'#3399FF',false);
  eye(ctx,22,-18,10,8,'#3399FF',false);
  // lashes
  ctx.strokeStyle='#222'; ctx.lineWidth=1.5;
  [[-2,-24],[1,-25],[4,-25],[7,-24]].forEach(([lx,ly])=>{ ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx-1,ly-3); ctx.stroke(); });
  [[18,-24],[21,-25],[24,-25],[27,-24]].forEach(([lx,ly])=>{ ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx-1,ly-3); ctx.stroke(); });
  // grille + headlights
  ctx.beginPath(); ctx.roundRect(-58,2,14,10,3); ctx.fillStyle='#FFD700'; ctx.fill();
  ctx.beginPath(); ctx.roundRect(-58,6,8,6,2); ctx.fillStyle='#333'; ctx.fill();
  wheel(ctx,-38,28,15,'#29B6F6'); wheel(ctx,36,28,15,'#29B6F6');
  ctx.restore();
}

function drawDoc(ctx, cx, cy, sc, t) {
  ctx.save(); ctx.translate(cx, cy + Math.sin(t*0.006+3)*5*sc); ctx.scale(sc,sc);
  ctx.beginPath(); ctx.ellipse(0,40,60,9,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fill();
  // fins at back
  ctx.beginPath(); ctx.moveTo(52,-5); ctx.lineTo(62,-22); ctx.lineTo(62,5); ctx.closePath();
  ctx.fillStyle='#0D47A1'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(52,5); ctx.lineTo(62,22); ctx.lineTo(62,10); ctx.closePath();
  ctx.fillStyle='#0D47A1'; ctx.fill();
  // body - 1951 Hudson style (long, low, boxy)
  ctx.beginPath();
  ctx.moveTo(-62,18); ctx.bezierCurveTo(-64,0,-50,-10,-20,-18);
  ctx.lineTo(18,-20); ctx.bezierCurveTo(40,-20,55,-10,60,0);
  ctx.lineTo(62,18); ctx.closePath();
  ctx.fillStyle='#1565C0'; ctx.fill(); ctx.strokeStyle='#0D47A1'; ctx.lineWidth=2; ctx.stroke();
  // body stripe
  ctx.beginPath(); ctx.moveTo(-60,4); ctx.lineTo(60,4); ctx.lineTo(60,10); ctx.lineTo(-60,10); ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fill();
  // windshield
  ctx.beginPath();
  ctx.moveTo(-10,-17); ctx.lineTo(22,-19); ctx.lineTo(34,-8); ctx.lineTo(-10,-8);
  ctx.closePath(); ctx.fillStyle='rgba(135,200,255,0.75)'; ctx.fill();
  ctx.strokeStyle='#0a3070'; ctx.lineWidth=1.5; ctx.stroke();
  // stern eyes (squinting)
  eye(ctx,2,-13,10,7,'#2244AA',true);
  eye(ctx,20,-13,10,7,'#2244AA',true);
  // eyebrows - stern
  ctx.strokeStyle='#0a2060'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-5,-17); ctx.lineTo(9,-20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,-18); ctx.lineTo(28,-20); ctx.stroke();
  // "51" number
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font='bold 12px Arial'; ctx.textAlign='center';
  ctx.fillText('51',-38,12);
  // grille (horizontal bars)
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.moveTo(-60,-4+i*5); ctx.lineTo(-50,-4+i*5);
    ctx.strokeStyle='#aaa'; ctx.lineWidth=2; ctx.stroke();
  }
  wheel(ctx,-40,30,16,'#1565C0'); wheel(ctx,38,30,16,'#1565C0');
  ctx.restore();
}

function drawRamone(ctx, cx, cy, sc, t) {
  ctx.save(); ctx.translate(cx, cy + Math.sin(t*0.006+4)*5*sc); ctx.scale(sc,sc);
  ctx.beginPath(); ctx.ellipse(0,36,65,8,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fill();
  // lowrider - very low profile
  ctx.beginPath();
  ctx.moveTo(-65,12); ctx.bezierCurveTo(-68,-6,-45,-15,-5,-19);
  ctx.lineTo(20,-19); ctx.bezierCurveTo(48,-19,62,-8,66,-2);
  ctx.lineTo(66,12); ctx.closePath();
  ctx.fillStyle='#8E24AA'; ctx.fill(); ctx.strokeStyle='#4A148C'; ctx.lineWidth=2; ctx.stroke();
  // flame details
  ctx.save();
  const flameGrad = ctx.createLinearGradient(-65,0,0,0);
  flameGrad.addColorStop(0,'rgba(255,100,0,0.8)');
  flameGrad.addColorStop(1,'rgba(255,200,0,0)');
  ctx.beginPath();
  ctx.moveTo(-65,5); ctx.bezierCurveTo(-55,-8,-45,2,-35,-10);
  ctx.bezierCurveTo(-25,2,-18,-6,-10,2); ctx.lineTo(-10,12); ctx.lineTo(-65,12);
  ctx.fillStyle=flameGrad; ctx.fill();
  ctx.restore();
  // windshield
  ctx.beginPath();
  ctx.moveTo(-5,-18); ctx.lineTo(28,-18); ctx.lineTo(40,-8); ctx.lineTo(-5,-8);
  ctx.closePath(); ctx.fillStyle='rgba(135,200,255,0.8)'; ctx.fill();
  ctx.strokeStyle='#4A148C'; ctx.lineWidth=1.5; ctx.stroke();
  // eyes
  eye(ctx,6,-14,10,7,'#AA44CC',false);
  eye(ctx,24,-14,10,7,'#AA44CC',false);
  // chrome details
  ctx.strokeStyle='rgba(200,200,255,0.7)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-40,0); ctx.lineTo(-40,12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-48,0); ctx.lineTo(-48,12); ctx.stroke();
  // whitewall wheels
  wheel(ctx,-42,26,16,'#8E24AA'); wheel(ctx,42,26,16,'#8E24AA');
  // whitewall ring
  [[-42,26],[42,26]].forEach(([wx,wy])=>{
    ctx.beginPath(); ctx.arc(wx,wy,11,0,Math.PI*2);
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  });
  ctx.restore();
}

function drawChick(ctx, cx, cy, sc, t) {
  ctx.save(); ctx.translate(cx, cy + Math.sin(t*0.006+5)*5*sc); ctx.scale(sc,sc);
  ctx.beginPath(); ctx.ellipse(0,40,60,9,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fill();
  // rear spoiler
  ctx.beginPath(); ctx.moveTo(48,-18); ctx.lineTo(60,-28); ctx.lineTo(60,-18); ctx.lineTo(48,-10);
  ctx.fillStyle='#1B5E20'; ctx.fill();
  // body
  ctx.beginPath();
  ctx.moveTo(-60,16); ctx.bezierCurveTo(-62,-4,-46,-14,-18,-22);
  ctx.lineTo(16,-28); ctx.bezierCurveTo(36,-28,50,-14,56,-4);
  ctx.lineTo(58,16); ctx.closePath();
  ctx.fillStyle='#2E7D32'; ctx.fill(); ctx.strokeStyle='#1B5E20'; ctx.lineWidth=2; ctx.stroke();
  // side vent details
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=2;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-50+i*12,0); ctx.lineTo(-46+i*12,14); ctx.stroke(); }
  // windshield
  ctx.beginPath();
  ctx.moveTo(-4,-27); ctx.lineTo(30,-27); ctx.lineTo(42,-10); ctx.lineTo(-4,-10);
  ctx.closePath(); ctx.fillStyle='rgba(120,200,100,0.7)'; ctx.fill();
  ctx.strokeStyle='#1B5E20'; ctx.lineWidth=1.5; ctx.stroke();
  // menacing eyes
  eye(ctx,8,-20,10,7,'#00CC44',true);
  eye(ctx,26,-20,10,7,'#00CC44',true);
  // menacing eyebrows
  ctx.strokeStyle='#000'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(2,-25); ctx.lineTo(15,-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,-22); ctx.lineTo(33,-25); ctx.stroke();
  // smirk
  ctx.beginPath(); ctx.moveTo(-40,5); ctx.bezierCurveTo(-30,3,-20,10,-10,6);
  ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.stroke();
  // #86
  ctx.fillStyle='#fff'; ctx.font='bold 13px Arial'; ctx.textAlign='center';
  ctx.fillText('86',-44,10);
  wheel(ctx,-38,28,16,'#2E7D32'); wheel(ctx,36,28,16,'#2E7D32');
  ctx.restore();
}

// ── Background ────────────────────────────────────────────────────────────────
function drawBackground() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0,0,0,H*0.65);
  sky.addColorStop(0,'#1a90d0'); sky.addColorStop(1,'#87CEEB');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // Sun
  const sunX=W*0.82, sunY=H*0.12, sunR=H*0.07;
  const sunGlow=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*2.5);
  sunGlow.addColorStop(0,'rgba(255,230,80,0.6)'); sunGlow.addColorStop(1,'rgba(255,200,0,0)');
  ctx.beginPath(); ctx.arc(sunX,sunY,sunR*2.5,0,Math.PI*2);
  ctx.fillStyle=sunGlow; ctx.fill();
  ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,Math.PI*2);
  ctx.fillStyle='#FFD700'; ctx.fill();

  // Radiator Springs rock formations
  const rocks=[
    {x:W*0.05,w:W*0.12,h:H*0.28,color:'#c45e2a'},
    {x:W*0.14,w:W*0.08,h:H*0.38,color:'#d46a32'},
    {x:W*0.72,w:W*0.14,h:H*0.32,color:'#c45e2a'},
    {x:W*0.84,w:W*0.12,h:H*0.22,color:'#d46a32'},
  ];
  rocks.forEach(r=>{
    const gy=H*0.65-r.h;
    ctx.beginPath();
    ctx.moveTo(r.x,H*0.65);
    ctx.lineTo(r.x,gy+r.h*0.15);
    ctx.bezierCurveTo(r.x+r.w*0.1,gy,r.x+r.w*0.4,gy*0.98,r.x+r.w*0.5,gy);
    ctx.bezierCurveTo(r.x+r.w*0.6,gy*0.98,r.x+r.w*0.9,gy+r.h*0.1,r.x+r.w,gy+r.h*0.2);
    ctx.lineTo(r.x+r.w,H*0.65);
    ctx.fillStyle=r.color; ctx.fill();
    // rock shadow side
    ctx.beginPath();
    ctx.moveTo(r.x+r.w*0.5,gy); ctx.lineTo(r.x+r.w,gy+r.h*0.2); ctx.lineTo(r.x+r.w,H*0.65);
    ctx.lineTo(r.x+r.w*0.5,H*0.65); ctx.closePath();
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fill();
  });

  // Ground / desert
  const ground=ctx.createLinearGradient(0,H*0.62,0,H*0.72);
  ground.addColorStop(0,'#d4863c'); ground.addColorStop(1,'#b8692a');
  ctx.fillStyle=ground; ctx.fillRect(0,H*0.62,W,H*0.12);

  // Road
  const roadTop=H*0.70, roadH=H*0.30;
  const road=ctx.createLinearGradient(0,roadTop,0,H);
  road.addColorStop(0,'#444'); road.addColorStop(1,'#333');
  ctx.fillStyle=road; ctx.fillRect(0,roadTop,W,roadH);

  // Road edge lines
  ctx.fillStyle='#FFD700';
  ctx.fillRect(0,roadTop+2,W,4);

  // Center dashed line
  ctx.setLineDash([W*0.06,W*0.04]);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,roadTop+roadH*0.5); ctx.lineTo(W,roadTop+roadH*0.5);
  ctx.stroke(); ctx.setLineDash([]);

  // Route 66 sign
  const sx=W*0.5-28, sy=H*0.66;
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.roundRect(sx,sy,56,36,6); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
  ctx.fillText('RUTA',W*0.5,sy+14);
  ctx.font='bold 14px Arial'; ctx.fillText('66',W*0.5,sy+30);
}

// ── Particles ─────────────────────────────────────────────────────────────────
const COLORS=['#FF5252','#FFD740','#69F0AE','#40C4FF','#EA80FC','#FF6D00','#FFFFFF','#FF80AB'];
class Particle {
  constructor(x,y) {
    this.x=x; this.y=y;
    this.vx=(Math.random()-0.5)*14;
    this.vy=-Math.random()*14-6;
    this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
    this.size=Math.random()*10+5;
    this.life=1;
    this.decay=Math.random()*0.015+0.012;
    this.isstar=Math.random()<0.4;
    this.rot=Math.random()*Math.PI;
    this.rotV=(Math.random()-0.5)*0.2;
  }
  update() {
    this.x+=this.vx; this.y+=this.vy;
    this.vy+=0.45; this.vx*=0.97;
    this.life-=this.decay;
    this.rot+=this.rotV;
  }
  draw(ctx) {
    ctx.save(); ctx.globalAlpha=Math.max(0,this.life);
    ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.fillStyle=this.color;
    if(this.isstar){
      // 5-point star
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a=i*Math.PI*2/5 - Math.PI/2;
        const ai=a+Math.PI/5;
        i===0?ctx.moveTo(Math.cos(a)*this.size,Math.sin(a)*this.size)
             :ctx.lineTo(Math.cos(a)*this.size,Math.sin(a)*this.size);
        ctx.lineTo(Math.cos(ai)*this.size*0.42,Math.sin(ai)*this.size*0.42);
      }
      ctx.closePath();
    } else {
      ctx.beginPath(); ctx.roundRect(-this.size/2,-this.size/3,this.size,this.size*0.6,2);
    }
    ctx.fill(); ctx.restore();
  }
}

// ── Ring burst ────────────────────────────────────────────────────────────────
class RingBurst {
  constructor(x,y,color){ this.x=x; this.y=y; this.r=0; this.life=1; this.color=color||'#FFD700'; }
  update(){ this.r+=8; this.life-=0.04; }
  draw(ctx){
    ctx.save(); ctx.globalAlpha=Math.max(0,this.life);
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.strokeStyle=this.color; ctx.lineWidth=3*(1-this.r/200); ctx.stroke();
    ctx.restore();
  }
}

// ── Celebration ───────────────────────────────────────────────────────────────
class Celebration {
  constructor(x, y, char) {
    this.x = x; this.y = y; this.char = char;
    this.phrase = char.phrases[Math.floor(Math.random()*char.phrases.length)];
    this.particles = Array.from({length:40}, ()=>new Particle(x,y));
    this.rings = [new RingBurst(x,y,char.glow), new RingBurst(x,y,'#ffffff')];
    this.rings[1].r = 30;
    this.t = 0; this.life = 1;
    this.carX = x < W/2 ? -120 : W+120;
    this.carTargetX = W/2;
    this.carY = H*0.78;
    this.carScale = Math.min(W,H)*0.0013;
    this.arrived = false;
    this.holdTimer = 0;
    this.leaving = false;
    this.carVX = (this.carTargetX - this.carX) * 0.06;
    this.textAlpha = 0;
    this.nameAlpha = 0;
  }
  update(dt) {
    this.t += dt;
    this.particles.forEach(p=>p.update());
    this.rings.forEach(r=>r.update());
    // Car drives in
    if(!this.arrived){
      this.carX += (this.carTargetX - this.carX) * 0.08;
      if(Math.abs(this.carX - this.carTargetX) < 2){ this.arrived=true; }
    } else {
      this.holdTimer += dt;
      this.textAlpha = Math.min(1, this.textAlpha+0.06);
      this.nameAlpha = Math.min(1, this.nameAlpha+0.04);
      if(this.holdTimer > 1600) this.leaving=true;
    }
    if(this.leaving){ this.life -= 0.018; this.carX += this.carX < W/2 ? -6 : 6; }
  }
  done() { return this.life <= 0; }
  draw(ctx) {
    ctx.save(); ctx.globalAlpha=Math.max(0,this.life);
    this.particles.forEach(p=>p.draw(ctx));
    this.rings.forEach(r=>r.draw(ctx));
    // Car
    const flip = this.x > W/2;
    ctx.save();
    if(flip){ ctx.translate(this.carX*2,0); ctx.scale(-1,1); }
    this.char.draw(ctx, this.carX, this.carY, this.carScale, this.t);
    ctx.restore();
    // Character name
    if(this.arrived && this.nameAlpha > 0){
      ctx.globalAlpha = Math.max(0,this.life) * this.nameAlpha;
      const nameY = this.carY - 90*this.carScale - 10;
      ctx.font = `bold ${Math.round(W*0.045)}px Arial`;
      ctx.textAlign='center';
      ctx.strokeStyle='#000'; ctx.lineWidth=5; ctx.strokeText(this.char.name, this.carX, nameY);
      ctx.fillStyle=this.char.color; ctx.fillText(this.char.name, this.carX, nameY);
    }
    // Phrase
    if(this.arrived && this.textAlpha > 0){
      ctx.globalAlpha = Math.max(0,this.life) * this.textAlpha;
      const py = this.carY - 90*this.carScale - 10 - W*0.055;
      const fs = Math.round(W*0.06);
      ctx.font = `bold ${fs}px Arial`;
      ctx.textAlign='center';
      ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=6; ctx.strokeText(this.phrase, W/2, py);
      ctx.fillStyle='#FFD700'; ctx.fillText(this.phrase, W/2, py);
    }
    ctx.restore();
  }
}

// ── State ─────────────────────────────────────────────────────────────────────
let celebrations = [];
let taps = 0;
let lastTime = performance.now();

function spawnCelebration(x, y) {
  const char = CHARS[charIdx % CHARS.length];
  charIdx++;
  celebrations.push(new Celebration(x, y, char));
  playCheer(charIdx);
  taps++;
  if(taps > 0) prompt.style.display = 'none';
}

// ── Touch / click ─────────────────────────────────────────────────────────────
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches) spawnCelebration(t.clientX, t.clientY);
}, {passive:false});

canvas.addEventListener('mousedown', e=>{
  spawnCelebration(e.clientX, e.clientY);
});

// ── Game loop ─────────────────────────────────────────────────────────────────
function loop(now) {
  const dt = Math.min(now - lastTime, 40);
  lastTime = now;

  drawBackground();

  celebrations.forEach(c=>c.update(dt));
  celebrations = celebrations.filter(c=>!c.done());
  celebrations.forEach(c=>c.draw(ctx));

  // Tap counter (top)
  if(taps > 0){
    ctx.save();
    ctx.font=`bold ${Math.round(W*0.06)}px Arial`;
    ctx.textAlign='left';
    ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=5;
    ctx.strokeText(`⭐ ${taps}`, 16, 48);
    ctx.fillStyle='#FFD700'; ctx.fillText(`⭐ ${taps}`, 16, 48);
    ctx.restore();
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
