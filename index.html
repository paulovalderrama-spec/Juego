<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Cars - ¡Atrapa los autos!</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; touch-action:none; }
    canvas { display:block; width:100vw; height:100dvh; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ── Audio ──────────────────────────────────────────────────────────────────────
let ac;
function playPop() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100, 1320].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ac.currentTime + i * 0.07;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.start(t); o.stop(t + 0.32);
    });
  } catch(e) {}
}

// ── Sizes ─────────────────────────────────────────────────────────────────────
function HL() { return Math.min(W, H) * 0.1; }   // half-length of car
function HW() { return HL() * 0.46; }             // half-width of car

// ── Top-down wheel helper ─────────────────────────────────────────────────────
function wheel(ctx, wx, wy, wl, ww, hub) {
  ctx.save(); ctx.translate(wx, wy);
  ctx.beginPath(); ctx.ellipse(0,0,wl,ww,0,0,Math.PI*2); ctx.fillStyle='#111'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,0,wl*.55,ww*.55,0,0,Math.PI*2); ctx.fillStyle='#777'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,0,wl*.28,ww*.28,0,0,Math.PI*2); ctx.fillStyle=hub; ctx.fill();
  ctx.restore();
}

// ── McQueen (top-down, front = +X) ───────────────────────────────────────────
function drawMcQueen(ctx, x, y, angle, hl, hw) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  // shadow
  ctx.beginPath(); ctx.ellipse(hl*.07,hw*.14,hl*.9,hw*.84,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fill();
  // big rear spoiler
  ctx.beginPath(); ctx.rect(-hl-hw*.18,-hw*.9,hw*.2,hw*1.8);
  ctx.fillStyle='#880000'; ctx.fill();
  // body – red teardrop
  ctx.beginPath();
  ctx.moveTo(hl,0);
  ctx.bezierCurveTo(hl*.85,-hw*.95,hl*.18,-hw*1.05,-hl*.4,-hw*.98);
  ctx.lineTo(-hl*.84,-hw*.65); ctx.lineTo(-hl,-hw*.3); ctx.lineTo(-hl,hw*.3);
  ctx.lineTo(-hl*.84,hw*.65); ctx.lineTo(-hl*.4,hw*.98);
  ctx.bezierCurveTo(hl*.18,hw*1.05,hl*.85,hw*.95,hl,0);
  ctx.closePath(); ctx.fillStyle='#DD1111'; ctx.fill();
  ctx.strokeStyle='#990000'; ctx.lineWidth=2; ctx.stroke();
  // shine
  ctx.save(); ctx.clip();
  const sh=ctx.createLinearGradient(-hl*.5,-hw*.9,hl*.3,-hw*.1);
  sh.addColorStop(0,'rgba(255,255,255,0)'); sh.addColorStop(.5,'rgba(255,160,160,.4)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; ctx.fill(); ctx.restore();
  // windshield
  ctx.beginPath(); ctx.moveTo(hl*.25,-hw*.58); ctx.lineTo(hl*.72,-hw*.28); ctx.lineTo(hl*.72,hw*.28); ctx.lineTo(hl*.25,hw*.58); ctx.closePath();
  ctx.fillStyle='rgba(140,215,255,.88)'; ctx.fill(); ctx.strokeStyle='#0055AA'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hl*.3,-hw*.5); ctx.lineTo(hl*.66,-hw*.18); ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; ctx.stroke();
  // rear window
  ctx.beginPath(); ctx.moveTo(-hl*.42,-hw*.52); ctx.lineTo(-hl*.72,-hw*.38); ctx.lineTo(-hl*.72,hw*.38); ctx.lineTo(-hl*.42,hw*.52); ctx.closePath();
  ctx.fillStyle='rgba(100,175,230,.7)'; ctx.fill();
  // lightning bolt on roof
  ctx.beginPath();
  ctx.moveTo(hl*.14,-hw*.32); ctx.lineTo(hl*.27,-hw*.04); ctx.lineTo(hl*.17,-hw*.04);
  ctx.lineTo(hl*.3,hw*.32); ctx.lineTo(hl*.17,hw*.04); ctx.lineTo(hl*.27,hw*.04); ctx.lineTo(hl*.1,-hw*.32);
  ctx.closePath(); ctx.fillStyle='#FFD700'; ctx.fill(); ctx.strokeStyle='#CC8800'; ctx.lineWidth=1; ctx.stroke();
  // "95"
  ctx.fillStyle='#fff'; ctx.font=`bold ${hw*.75}px 'Arial Black',Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle='#CC0000'; ctx.lineWidth=3; ctx.strokeText('95',-hl*.32,0); ctx.fillText('95',-hl*.32,0);
  // wheels
  const wl=hw*.42,ww=hw*.22;
  [[hl*.56,-hw*1.0],[hl*.56,hw*1.0],[-hl*.44,-hw*1.0],[-hl*.44,hw*1.0]].forEach(([a,b])=>wheel(ctx,a,b,wl,ww,'#CC0000'));
  ctx.restore();
}

// ── Mater (top-down) ──────────────────────────────────────────────────────────
function drawMater(ctx, x, y, angle, hl, hw) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath(); ctx.ellipse(hl*.07,hw*.14,hl*.98,hw*.9,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fill();
  // tow arm + hook (at back = -X)
  ctx.beginPath(); ctx.moveTo(-hl,0); ctx.lineTo(-hl*1.45,-hw*.15); ctx.lineTo(-hl*1.45,hw*.15); ctx.closePath();
  ctx.fillStyle='#666'; ctx.fill();
  ctx.beginPath(); ctx.arc(-hl*1.48,0,hw*.2,0,Math.PI*2); ctx.strokeStyle='#999'; ctx.lineWidth=4; ctx.stroke();
  // truck bed
  ctx.beginPath(); ctx.roundRect(-hl*.82,-hw*.9,hl*.88,hw*1.8,4);
  ctx.fillStyle='#6B4510'; ctx.fill(); ctx.strokeStyle='#3a2200'; ctx.lineWidth=2; ctx.stroke();
  // cab (front)
  ctx.beginPath(); ctx.roundRect(hl*.06,-hw*.94,hl*.74,hw*1.88,6);
  ctx.fillStyle='#9B6A2A'; ctx.fill(); ctx.strokeStyle='#5a3a0a'; ctx.lineWidth=2; ctx.stroke();
  // cab shine
  ctx.save(); ctx.clip();
  const cg=ctx.createLinearGradient(hl*.06,-hw*.94,hl*.8,0);
  cg.addColorStop(0,'rgba(180,130,60,.45)'); cg.addColorStop(1,'rgba(100,60,0,0)');
  ctx.fillStyle=cg; ctx.fill(); ctx.restore();
  // windshield
  ctx.beginPath(); ctx.moveTo(hl*.22,-hw*.6); ctx.lineTo(hl*.72,-hw*.44); ctx.lineTo(hl*.72,hw*.44); ctx.lineTo(hl*.22,hw*.6); ctx.closePath();
  ctx.fillStyle='rgba(135,210,255,.82)'; ctx.fill(); ctx.strokeStyle='#4A2800'; ctx.lineWidth=1.5; ctx.stroke();
  // rust patches
  ctx.fillStyle='rgba(150,70,0,.35)';
  [[hl*.3,-hw*.3,hw*.25,hw*.15],[- hl*.35,hw*.22,hw*.18,hw*.12],[hl*.6,hw*.5,hw*.14,hw*.1]].forEach(([a,b,c,d])=>{
    ctx.beginPath(); ctx.ellipse(a,b,c,d,.3,0,Math.PI*2); ctx.fill();
  });
  // dent lines
  ctx.strokeStyle='rgba(80,40,0,.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-hl*.5,-hw*.7); ctx.lineTo(-hl*.28,-hw*.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-hl*.52,hw*.45); ctx.lineTo(-hl*.62,hw*.22); ctx.stroke();
  // wheels
  const wl=hw*.44,ww=hw*.24;
  [[hl*.56,-hw*.98],[hl*.56,hw*.98],[-hl*.44,-hw*.98],[-hl*.44,hw*.98]].forEach(([a,b])=>wheel(ctx,a,b,wl,ww,'#8B5A1A'));
  ctx.restore();
}

// ── Sally (top-down) ──────────────────────────────────────────────────────────
function drawSally(ctx, x, y, angle, hl, hw) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath(); ctx.ellipse(hl*.07,hw*.14,hl*.88,hw*.84,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.fill();
  // body – smooth Porsche
  ctx.beginPath();
  ctx.moveTo(hl,0);
  ctx.bezierCurveTo(hl*.9,-hw*.82,hl*.5,-hw*1.04,0,-hw*1.02);
  ctx.bezierCurveTo(-hl*.42,-hw*.98,-hl*.82,-hw*.74,-hl,-hw*.38);
  ctx.lineTo(-hl,hw*.38);
  ctx.bezierCurveTo(-hl*.82,hw*.74,-hl*.42,hw*.98,0,hw*1.02);
  ctx.bezierCurveTo(hl*.5,hw*1.04,hl*.9,hw*.82,hl,0);
  ctx.closePath(); ctx.fillStyle='#29B6F6'; ctx.fill(); ctx.strokeStyle='#0277BD'; ctx.lineWidth=2; ctx.stroke();
  // shine
  ctx.save(); ctx.clip();
  const sh=ctx.createLinearGradient(-hl*.4,-hw*.9,hl*.4,-hw*.1);
  sh.addColorStop(0,'rgba(255,255,255,0)'); sh.addColorStop(.45,'rgba(180,235,255,.45)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; ctx.fill(); ctx.restore();
  // windshield
  ctx.beginPath(); ctx.moveTo(hl*.22,-hw*.6); ctx.lineTo(hl*.68,-hw*.28); ctx.lineTo(hl*.68,hw*.28); ctx.lineTo(hl*.22,hw*.6); ctx.closePath();
  ctx.fillStyle='rgba(130,215,255,.86)'; ctx.fill(); ctx.strokeStyle='#0277BD'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hl*.28,-hw*.52); ctx.lineTo(hl*.62,-hw*.18); ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; ctx.stroke();
  // rear window
  ctx.beginPath(); ctx.moveTo(-hl*.36,-hw*.58); ctx.lineTo(-hl*.7,-hw*.42); ctx.lineTo(-hl*.7,hw*.42); ctx.lineTo(-hl*.36,hw*.58); ctx.closePath();
  ctx.fillStyle='rgba(100,190,245,.72)'; ctx.fill();
  // tattoo stripe on roof
  ctx.beginPath(); ctx.moveTo(hl*.05,-hw*.3); ctx.bezierCurveTo(-hl*.2,-hw*.35,-hl*.45,-hw*.2,-hl*.5,0);
  ctx.bezierCurveTo(-hl*.45,hw*.2,-hl*.2,hw*.35,hl*.05,hw*.3);
  ctx.strokeStyle='rgba(0,100,200,.55)'; ctx.lineWidth=3; ctx.stroke();
  // wheels
  const wl=hw*.4,ww=hw*.22;
  [[hl*.56,-hw*1.0],[hl*.56,hw*1.0],[-hl*.44,-hw*1.0],[-hl*.44,hw*1.0]].forEach(([a,b])=>wheel(ctx,a,b,wl,ww,'#29B6F6'));
  ctx.restore();
}

// ── Doc Hudson (top-down) ────────────────────────────────────────────────────
function drawDoc(ctx, x, y, angle, hl, hw) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath(); ctx.ellipse(hl*.07,hw*.12,hl*.96,hw*.88,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fill();
  // tail fins at back (1951 Hudson's signature feature)
  ctx.beginPath(); ctx.moveTo(-hl,-hw*.5); ctx.lineTo(-hl*1.18,-hw*.92); ctx.lineTo(-hl*.85,-hw*.84); ctx.lineTo(-hl,-hw*.32); ctx.closePath();
  ctx.fillStyle='#0D47A1'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-hl,hw*.5); ctx.lineTo(-hl*1.18,hw*.92); ctx.lineTo(-hl*.85,hw*.84); ctx.lineTo(-hl,hw*.32); ctx.closePath();
  ctx.fillStyle='#0D47A1'; ctx.fill();
  // body – long, stately
  ctx.beginPath();
  ctx.moveTo(hl,0);
  ctx.bezierCurveTo(hl*.9,-hw*.7,hl*.5,-hw*.96,0,-hw*.95);
  ctx.lineTo(-hl*.5,-hw*.92); ctx.lineTo(-hl*.85,-hw*.64); ctx.lineTo(-hl,-hw*.32);
  ctx.lineTo(-hl,hw*.32); ctx.lineTo(-hl*.85,hw*.64); ctx.lineTo(-hl*.5,hw*.92); ctx.lineTo(0,hw*.95);
  ctx.bezierCurveTo(hl*.5,hw*.96,hl*.9,hw*.7,hl,0);
  ctx.closePath(); ctx.fillStyle='#1565C0'; ctx.fill(); ctx.strokeStyle='#0D47A1'; ctx.lineWidth=2; ctx.stroke();
  // shine
  ctx.save(); ctx.clip();
  const sh=ctx.createLinearGradient(-hl*.3,-hw*.9,hl*.3,0);
  sh.addColorStop(0,'rgba(255,255,255,0)'); sh.addColorStop(.45,'rgba(100,160,255,.38)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; ctx.fill(); ctx.restore();
  // chrome side stripe
  ctx.beginPath(); ctx.moveTo(hl*.5,-hw*.84); ctx.lineTo(-hl*.8,-hw*.86); ctx.strokeStyle='rgba(180,215,255,.65)'; ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hl*.5,hw*.84); ctx.lineTo(-hl*.8,hw*.86); ctx.strokeStyle='rgba(180,215,255,.65)'; ctx.lineWidth=3; ctx.stroke();
  // windshield
  ctx.beginPath(); ctx.moveTo(hl*.1,-hw*.58); ctx.lineTo(hl*.58,-hw*.32); ctx.lineTo(hl*.58,hw*.32); ctx.lineTo(hl*.1,hw*.58); ctx.closePath();
  ctx.fillStyle='rgba(120,195,255,.8)'; ctx.fill(); ctx.strokeStyle='#0a3070'; ctx.lineWidth=1.5; ctx.stroke();
  // "51"
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font=`bold ${hw*.75}px 'Arial Black',Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle='#0D47A1'; ctx.lineWidth=3; ctx.strokeText('51',-hl*.32,0); ctx.fillText('51',-hl*.32,0);
  // wheels
  const wl=hw*.42,ww=hw*.22;
  [[hl*.56,-hw*1.0],[hl*.56,hw*1.0],[-hl*.43,-hw*1.0],[-hl*.43,hw*1.0]].forEach(([a,b])=>wheel(ctx,a,b,wl,ww,'#1565C0'));
  ctx.restore();
}

// ── Ramone (top-down) ─────────────────────────────────────────────────────────
function drawRamone(ctx, x, y, angle, hl, hw) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath(); ctx.ellipse(hl*.07,hw*.12,hl*.92,hw*1.02,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fill();
  // wide lowrider body
  ctx.beginPath();
  ctx.moveTo(hl,0);
  ctx.bezierCurveTo(hl*.88,-hw*1.12,hl*.4,-hw*1.2,-hl*.2,-hw*1.14);
  ctx.lineTo(-hl*.7,-hw*.97); ctx.lineTo(-hl,-hw*.5); ctx.lineTo(-hl,hw*.5);
  ctx.lineTo(-hl*.7,hw*.97); ctx.lineTo(-hl*.2,hw*1.14);
  ctx.bezierCurveTo(hl*.4,hw*1.2,hl*.88,hw*1.12,hl,0);
  ctx.closePath(); ctx.fillStyle='#8E24AA'; ctx.fill(); ctx.strokeStyle='#4A148C'; ctx.lineWidth=2; ctx.stroke();
  // flame on left side (visible from above)
  const fg=ctx.createLinearGradient(-hl,-hw,hl*.2,-hw*.6);
  fg.addColorStop(0,'rgba(255,100,0,.9)'); fg.addColorStop(1,'rgba(255,200,0,0)');
  ctx.beginPath(); ctx.moveTo(-hl,-hw*.96); ctx.bezierCurveTo(-hl*.6,-hw*1.22,-hl*.15,-hw*.92,hl*.1,-hw*1.08);
  ctx.bezierCurveTo(hl*.35,-hw*.88,hl*.55,-hw*1.02,hl*.62,-hw*.9); ctx.lineTo(hl*.62,-hw*.72); ctx.lineTo(-hl,-hw*.72); ctx.closePath();
  ctx.fillStyle=fg; ctx.fill();
  // flame on right side
  ctx.beginPath(); ctx.moveTo(-hl,hw*.96); ctx.bezierCurveTo(-hl*.6,hw*1.22,-hl*.15,hw*.92,hl*.1,hw*1.08);
  ctx.bezierCurveTo(hl*.35,hw*.88,hl*.55,hw*1.02,hl*.62,hw*.9); ctx.lineTo(hl*.62,hw*.72); ctx.lineTo(-hl,hw*.72); ctx.closePath();
  ctx.fillStyle=fg; ctx.fill();
  // shine
  ctx.save(); ctx.clip();
  const sh=ctx.createLinearGradient(-hl*.4,-hw,hl*.4,0);
  sh.addColorStop(0,'rgba(255,255,255,0)'); sh.addColorStop(.45,'rgba(220,140,255,.4)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; ctx.fill(); ctx.restore();
  // windshield (tinted purple)
  ctx.beginPath(); ctx.moveTo(hl*.2,-hw*.62); ctx.lineTo(hl*.7,-hw*.32); ctx.lineTo(hl*.7,hw*.32); ctx.lineTo(hl*.2,hw*.62); ctx.closePath();
  ctx.fillStyle='rgba(180,100,255,.7)'; ctx.fill(); ctx.strokeStyle='#4A148C'; ctx.lineWidth=1.5; ctx.stroke();
  // whitewall tires
  const wl=hw*.46,ww=hw*.26;
  [[hl*.56,-hw*1.14],[hl*.56,hw*1.14],[-hl*.44,-hw*1.14],[-hl*.44,hw*1.14]].forEach(([a,b])=>{
    ctx.save(); ctx.translate(a,b);
    ctx.beginPath(); ctx.ellipse(0,0,wl,ww,0,0,Math.PI*2); ctx.fillStyle='#111'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,0,wl*.76,ww*.76,0,0,Math.PI*2); ctx.strokeStyle='#ddd'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,wl*.5,ww*.5,0,0,Math.PI*2); ctx.fillStyle='#777'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,0,wl*.28,ww*.28,0,0,Math.PI*2); ctx.fillStyle='#8E24AA'; ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

// ── Chick Hicks (top-down) ────────────────────────────────────────────────────
function drawChick(ctx, x, y, angle, hl, hw) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath(); ctx.ellipse(hl*.07,hw*.14,hl*.96,hw*.88,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fill();
  // big rear spoiler (Chick has a massive one)
  ctx.beginPath(); ctx.rect(-hl-hw*.25,-hw*.98,hw*.28,hw*1.96); ctx.fillStyle='#1B5E20'; ctx.fill(); ctx.strokeStyle='#0a2e0a'; ctx.lineWidth=1; ctx.stroke();
  // spoiler struts
  ctx.fillStyle='#444';
  ctx.beginPath(); ctx.rect(-hl*.82,-hw*.14,hl*.08,hw*.28); ctx.fill();
  // body
  ctx.beginPath();
  ctx.moveTo(hl,0);
  ctx.bezierCurveTo(hl*.82,-hw*.92,hl*.15,-hw*1.04,-hl*.38,-hw*.98);
  ctx.lineTo(-hl*.82,-hw*.68); ctx.lineTo(-hl,-hw*.32); ctx.lineTo(-hl,hw*.32);
  ctx.lineTo(-hl*.82,hw*.68); ctx.lineTo(-hl*.38,hw*.98);
  ctx.bezierCurveTo(hl*.15,hw*1.04,hl*.82,hw*.92,hl,0);
  ctx.closePath(); ctx.fillStyle='#2E7D32'; ctx.fill(); ctx.strokeStyle='#1B5E20'; ctx.lineWidth=2; ctx.stroke();
  // shine
  ctx.save(); ctx.clip();
  const sh=ctx.createLinearGradient(-hl*.4,-hw*.9,hl*.3,0);
  sh.addColorStop(0,'rgba(255,255,255,0)'); sh.addColorStop(.45,'rgba(100,200,100,.35)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; ctx.fill(); ctx.restore();
  // hood vents
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=2;
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(hl*.75-i*hl*.1,-hw*.22);ctx.lineTo(hl*.75-i*hl*.1,hw*.22);ctx.stroke();}
  // windshield (green tinted)
  ctx.beginPath(); ctx.moveTo(hl*.22,-hw*.6); ctx.lineTo(hl*.7,-hw*.28); ctx.lineTo(hl*.7,hw*.28); ctx.lineTo(hl*.22,hw*.6); ctx.closePath();
  ctx.fillStyle='rgba(60,180,80,.68)'; ctx.fill(); ctx.strokeStyle='#1B5E20'; ctx.lineWidth=1.5; ctx.stroke();
  // rear window
  ctx.beginPath(); ctx.moveTo(-hl*.42,-hw*.54); ctx.lineTo(-hl*.72,-hw*.4); ctx.lineTo(-hl*.72,hw*.4); ctx.lineTo(-hl*.42,hw*.54); ctx.closePath();
  ctx.fillStyle='rgba(50,160,70,.62)'; ctx.fill();
  // "86"
  ctx.fillStyle='rgba(255,255,255,.92)'; ctx.font=`bold ${hw*.75}px 'Arial Black',Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle='#1B5E20'; ctx.lineWidth=3; ctx.strokeText('86',-hl*.3,0); ctx.fillText('86',-hl*.3,0);
  // wheels
  const wl=hw*.42,ww=hw*.22;
  [[hl*.56,-hw*1.0],[hl*.56,hw*1.0],[-hl*.43,-hw*1.0],[-hl*.43,hw*1.0]].forEach(([a,b])=>wheel(ctx,a,b,wl,ww,'#2E7D32'));
  ctx.restore();
}

// ── Character data ─────────────────────────────────────────────────────────────
const CHARS = [
  { name:'Rayo McQueen', color:'#DD1111', phrases:['¡Ka-Chow! ⚡','¡Soy el mejor! 🏆','¡Velocidad! 🔥'], draw:drawMcQueen },
  { name:'Mater',        color:'#8B5A1A', phrases:['¡Tú ganas, amigo! 💛','¡Bueno eso estuvo!','¡Yeehaw! 🤠'], draw:drawMater  },
  { name:'Sally',        color:'#1E90FF', phrases:['¡Excelente! 💙','¡Fantástico! ✨','¡Bravo! 🎉'],       draw:drawSally  },
  { name:'Doc Hudson',   color:'#1565C0', phrases:['¡Bien hecho! ⭐','¡Campeón! 🏅','¡Así se hace!'],      draw:drawDoc    },
  { name:'Ramone',       color:'#8E24AA', phrases:['¡Eso es arte! 💜','¡Ay caramba! 🎨','¡Pintón! 💜'],    draw:drawRamone },
  { name:'Chick Hicks',  color:'#2E7D32', phrases:['¡Woohoo! 💚','¡Genial! 🎉','¡Sí sí sí! 🏁'],         draw:drawChick  },
];

// ── Game cars ─────────────────────────────────────────────────────────────────
const NUM_CARS = 5;
let charCursor = 0;

class GameCar {
  constructor(charIdx, initial = true) {
    this.charIdx = charIdx % CHARS.length;
    this.char = CHARS[this.charIdx];
    this.angle = Math.random() * Math.PI * 2;
    this.targetAngle = this.angle;
    this.turnTimer = 0;
    this.turnInterval = 1800 + Math.random() * 2200;
    this.alpha = 1;
    this.dying = false;
    this.dyingT = 0;
    this.spawning = false;
    this.spawnT = 0;
    if (initial) {
      const m = HL() * 1.5;
      this.x = m + Math.random() * (W - m * 2);
      this.y = m + Math.random() * (H - m * 2);
      this.alpha = 1;
    } else {
      this.spawnFromEdge();
    }
  }

  spawnFromEdge() {
    const h = HL();
    const side = Math.floor(Math.random() * 4);
    const m = h * 1.5;
    if (side===0){ this.x=m+Math.random()*(W-2*m); this.y=-h; this.angle=Math.PI*.5; }
    else if(side===1){ this.x=W+h; this.y=m+Math.random()*(H-2*m); this.angle=Math.PI; }
    else if(side===2){ this.x=m+Math.random()*(W-2*m); this.y=H+h; this.angle=-Math.PI*.5; }
    else { this.x=-h; this.y=m+Math.random()*(H-2*m); this.angle=0; }
    this.targetAngle = this.angle + (Math.random()-.5)*.8;
    this.alpha = 0; this.spawning = true; this.spawnT = 0;
  }

  speed() { return (1.6 + score * 0.04) * Math.min(W, H) / 500; }

  update(dt) {
    if (this.dying) { this.dyingT += dt; this.alpha = Math.max(0, 1 - this.dyingT/200); return; }
    if (this.spawning) { this.spawnT += dt; this.alpha = Math.min(1, this.spawnT/400); if(this.spawnT>=400)this.spawning=false; }

    this.turnTimer += dt;
    if (this.turnTimer > this.turnInterval) {
      this.turnTimer = 0; this.turnInterval = 1500 + Math.random()*2500;
      this.targetAngle = this.angle + (Math.random()-.5)*Math.PI*1.3;
    }

    const h = HL(), m = h * 2.2;
    if (this.x < m)     this.targetAngle = lerp(this.targetAngle, 0, .2);
    if (this.x > W - m) this.targetAngle = lerp(this.targetAngle, Math.PI, .2);
    if (this.y < m)     this.targetAngle = lerp(this.targetAngle, Math.PI*.5, .2);
    if (this.y > H - m) this.targetAngle = lerp(this.targetAngle, -Math.PI*.5, .2);

    let da = this.targetAngle - this.angle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    this.angle += da * .028;

    const sp = this.speed();
    this.x += Math.cos(this.angle) * sp * dt/16;
    this.y += Math.sin(this.angle) * sp * dt/16;
    const hc = HL()*1.1;
    this.x = Math.max(hc, Math.min(W-hc, this.x));
    this.y = Math.max(hc, Math.min(H-hc, this.y));
  }

  hit(tx, ty) {
    const h=HL(), hw=HW();
    const dx=tx-this.x, dy=ty-this.y;
    const cos=Math.cos(-this.angle), sin=Math.sin(-this.angle);
    const lx=dx*cos-dy*sin, ly=dx*sin+dy*cos;
    return (lx/h)*(lx/h)*.65 + (ly/hw)*(ly/hw)*.65 < 1.4;
  }

  draw(ctx) {
    ctx.save(); ctx.globalAlpha = this.alpha;
    this.char.draw(ctx, this.x, this.y, this.angle, HL(), HW());
    ctx.restore();
  }
}

function lerp(a,b,t){ return a+(b-a)*t; }

// ── Particles ─────────────────────────────────────────────────────────────────
const PCOLS=['#FF5252','#FFD740','#69F0AE','#40C4FF','#EA80FC','#FF6D00','#FFFFFF','#FF80AB'];
class Spark {
  constructor(x,y,col){
    this.x=x;this.y=y;
    this.vx=(Math.random()-.5)*18;this.vy=-Math.random()*16-4;
    this.col=col||PCOLS[Math.floor(Math.random()*PCOLS.length)];
    this.sz=Math.random()*10+5;this.life=1;this.decay=Math.random()*.018+.013;
    this.star=Math.random()<.42;this.rot=Math.random()*Math.PI;this.rv=(Math.random()-.5)*.24;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.48;this.vx*=.97;this.life-=this.decay;this.rot+=this.rv;}
  dead(){return this.life<=0;}
  draw(ctx){
    ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    ctx.fillStyle=this.col;
    if(this.star){
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a=i*Math.PI*2/5-Math.PI/2,ai=a+Math.PI/5;
        i===0?ctx.moveTo(Math.cos(a)*this.sz,Math.sin(a)*this.sz):ctx.lineTo(Math.cos(a)*this.sz,Math.sin(a)*this.sz);
        ctx.lineTo(Math.cos(ai)*this.sz*.42,Math.sin(ai)*this.sz*.42);
      }ctx.closePath();
    }else{ctx.beginPath();ctx.roundRect(-this.sz/2,-this.sz/3,this.sz,this.sz*.6,2);}
    ctx.fill();ctx.restore();
  }
}

class FloatText {
  constructor(x,y,text,col){
    this.x=x;this.y=y;this.text=text;this.col=col||'#FFD700';
    this.vy=-3.5;this.life=1;this.decay=.018;
    this.fs=Math.min(W,H)*.08;
  }
  update(){this.y+=this.vy;this.vy*=.94;this.life-=this.decay;}
  dead(){return this.life<=0;}
  draw(ctx){
    ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    ctx.font=`bold ${this.fs}px 'Arial Black',Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineWidth=7;ctx.strokeText(this.text,this.x,this.y);
    ctx.fillStyle=this.col;ctx.fillText(this.text,this.x,this.y);
    ctx.restore();
  }
}

class NameText {
  constructor(x,y,text,col){
    this.x=x;this.y=y;this.text=text;this.col=col;
    this.life=1;this.decay=.014;this.vy=-1.5;
    this.fs=Math.min(W,H)*.048;
  }
  update(){this.y+=this.vy;this.vy*=.97;this.life-=this.decay;}
  dead(){return this.life<=0;}
  draw(ctx){
    ctx.save();ctx.globalAlpha=Math.max(0,this.life)*.9;
    ctx.font=`bold ${this.fs}px 'Arial Black',Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineWidth=5;ctx.strokeText(this.text,this.x,this.y);
    ctx.fillStyle=this.col;ctx.fillText(this.text,this.x,this.y);
    ctx.restore();
  }
}

// ── Background (Radiator Springs top-down) ────────────────────────────────────
function drawBg() {
  // Desert floor
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#C88030');bg.addColorStop(.5,'#BE7428');bg.addColorStop(1,'#B06820');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Subtle terrain lines
  ctx.strokeStyle='rgba(160,90,10,.22)';ctx.lineWidth=1;
  for(let i=1;i<9;i++){
    ctx.beginPath();
    ctx.moveTo(0,H*i/9);
    ctx.bezierCurveTo(W*.3,H*i/9+H*.025,W*.7,H*i/9-H*.025,W,H*i/9);
    ctx.stroke();
  }

  // Road running through middle
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-W*.05,H*.42);
  ctx.bezierCurveTo(W*.28,H*.38,W*.72,H*.58,W*1.05,H*.5);
  ctx.lineWidth=H*.13;ctx.strokeStyle='#4a4a4a';ctx.stroke();
  // road edge lines
  ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.6)';
  for(const off of [-H*.063,H*.063]){
    ctx.beginPath();
    ctx.moveTo(-W*.05,H*.42+off);
    ctx.bezierCurveTo(W*.28,H*.38+off,W*.72,H*.58+off,W*1.05,H*.5+off);
    ctx.stroke();
  }
  // center dash
  ctx.setLineDash([W*.05,W*.04]);ctx.lineWidth=4;ctx.strokeStyle='rgba(255,220,0,.7)';
  ctx.beginPath();
  ctx.moveTo(-W*.05,H*.42);ctx.bezierCurveTo(W*.28,H*.38,W*.72,H*.58,W*1.05,H*.5);
  ctx.stroke();ctx.setLineDash([]);
  ctx.restore();

  // Rock/mesa shadows at edges
  const rocks=[
    {x:W*.07,y:H*.1,rx:W*.045,ry:H*.035},
    {x:W*.91,y:H*.18,rx:W*.05,ry:H*.03},
    {x:W*.05,y:H*.78,rx:W*.04,ry:H*.028},
    {x:W*.93,y:H*.72,rx:W*.048,ry:H*.032},
    {x:W*.5,y:H*.05,rx:W*.06,ry:H*.022},
    {x:W*.48,y:H*.95,rx:W*.055,ry:H*.025},
  ];
  rocks.forEach(r=>{
    ctx.beginPath();ctx.ellipse(r.x,r.y,r.rx,r.ry,0,0,Math.PI*2);
    ctx.fillStyle='rgba(130,60,0,.38)';ctx.fill();
    ctx.beginPath();ctx.ellipse(r.x-r.rx*.1,r.y-r.ry*.2,r.rx*.5,r.ry*.5,0,0,Math.PI*2);
    ctx.fillStyle='rgba(200,120,30,.28)';ctx.fill();
  });

  // "RADIATOR SPRINGS" text faint on ground
  ctx.save();
  ctx.globalAlpha=.08;
  ctx.font=`bold ${W*.06}px 'Arial Black',Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#000';
  ctx.fillText('RADIATOR SPRINGS',W*.5,H*.88);
  ctx.restore();
}

// ── State ─────────────────────────────────────────────────────────────────────
let cars=[], sparks=[], floats=[], score=0, hiScore=0, lastTime=performance.now();

function init() {
  cars=[];sparks=[];floats=[];score=0;
  for(let i=0;i<NUM_CARS;i++) cars.push(new GameCar(charCursor++, true));
}

function tapCar(tx,ty) {
  // check in reverse so top-rendered car wins
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];
    if(c.dying||c.spawning) continue;
    if(c.hit(tx,ty)){
      score++;
      hiScore=Math.max(hiScore,score);
      playPop();
      // burst
      for(let j=0;j<38;j++) sparks.push(new Spark(c.x,c.y,c.char.color));
      // floating texts
      floats.push(new FloatText(c.x,c.y-HL()*.5,'+1','#FFD700'));
      floats.push(new NameText(c.x,c.y-HL()*1.5,c.char.name,c.char.color));
      const phrase=c.char.phrases[Math.floor(Math.random()*c.char.phrases.length)];
      floats.push(new NameText(W/2,H*.18,phrase,c.char.color));
      // respawn this car as next character
      c.dying=true; c.dyingT=0;
      const nextIdx=charCursor++%CHARS.length;
      setTimeout(()=>{
        const idx=cars.indexOf(c);
        if(idx>=0) cars[idx]=new GameCar(nextIdx,false);
      },220);
      return true;
    }
  }
  return false;
}

canvas.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)tapCar(t.clientX,t.clientY);},{passive:false});
canvas.addEventListener('mousedown',e=>tapCar(e.clientX,e.clientY));

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD() {
  const fs=Math.min(W,H)*.07;
  // score panel
  ctx.save();
  const pw=W*.38,ph=fs*1.6,px=(W-pw)/2,py=12;
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath();ctx.roundRect(px,py,pw,ph,ph/2);ctx.fill();

  ctx.font=`bold ${fs}px 'Arial Black',Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#FFD700';
  ctx.fillText(`⭐ ${score}`,W/2,py+ph/2);

  // hi-score
  if(hiScore>0){
    const hfs=fs*.48;
    ctx.font=`bold ${hfs}px 'Arial Black',Arial`;
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.fillText(`MEJOR: ${hiScore}`,W/2,py+ph+hfs*.7);
  }

  // "toca los autos" hint at start
  if(score===0){
    const hfs=Math.min(W,H)*.045;
    ctx.font=`bold ${hfs}px 'Arial Black',Arial`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=4;
    ctx.strokeText('¡Toca los autos! 🏎️',W/2,H*.88);
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.fillText('¡Toca los autos! 🏎️',W/2,H*.88);
  }
  ctx.restore();
}

// ── Loop ─────────────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min(now-lastTime,40);lastTime=now;
  drawBg();
  cars.forEach(c=>c.update(dt));
  cars.forEach(c=>c.draw(ctx));
  sparks.forEach(s=>s.update());sparks=sparks.filter(s=>!s.dead());sparks.forEach(s=>s.draw(ctx));
  floats.forEach(f=>f.update());floats=floats.filter(f=>!f.dead());floats.forEach(f=>f.draw(ctx));
  drawHUD();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
